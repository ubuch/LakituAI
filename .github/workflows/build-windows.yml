name: Build Windows exe

# Runs only when manually triggered (Actions tab -> "Run workflow").
# No minutes are spent on pushes; add `workflow_dispatch` triggers only.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt

      - name: Install CPU-only torch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install build dependencies
        run: pip install -r requirements-build.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm LakituAI.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LakituAI-windows
          path: dist/LakituAI/
          if-no-files-found: error
          retention-days: 14
